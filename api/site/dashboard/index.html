<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard · SafeDay</title>
    <script>document.documentElement.dataset.theme = localStorage.getItem("safeday-theme") || "light";</script>
    <link rel="preload" href="/vendor/fonts/ubuntu-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/vendor/fonts/ubuntu-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/theme.css?v=6" />
    <link rel="stylesheet" href="/ui.css?v=4" />
    <link rel="stylesheet" href="/dashboard.css?v=5" />
    <script src="/ui.js?v=2" defer></script>
    <script src="/day-colour.js?v=2" defer></script>
    <script src="/payouts.js?v=6" defer></script>
    <script src="/site.js?v=18" defer></script>
    <link rel="stylesheet" href="/assistant.css?v=2" />
    <script src="/assistant.js?v=2" defer></script>
  </head>
  <body>
    <header class="topnav">
      <a class="brand" href="/"><span class="brand-mark"><svg class="i" aria-hidden="true"><use href="/vendor/icons.svg#shield-check"/></svg></span>SafeDay</a>
      <nav aria-label="Main">
        <a href="/map/" aria-label="Risk atlas"><svg class="i" aria-hidden="true"><use href="/vendor/icons.svg#map"/></svg><span class="label-wide">Risk atlas</span></a>
        <span id="whoami" class="who"></span>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme"><svg class="i" aria-hidden="true"><use href="/vendor/icons.svg#moon"/></svg></button>
        <button class="btn small" id="signout" type="button" aria-label="Sign out"><svg class="i" aria-hidden="true"><use href="/vendor/icons.svg#log-out"/></svg><span class="label-wide">Sign out</span></button>
      </nav>
    </header>

    <main class="dash" id="dash" aria-busy="true">
      <p class="loading" id="dash-loading">Loading your dashboard</p>
    </main>
  </body>
</html>
