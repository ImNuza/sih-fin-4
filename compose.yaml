# Hosted dashboard. The app sits on a network with no internet. cloudflared is the only way in.
# Run on the server as the hosting user. TUNNEL_TOKEN comes from an env file outside the repo:
#   docker compose --env-file ~/secrets/sih-fin-4.env up -d --build
name: sih-fin-4

services:
  dashboard:
    build: .
    image: sih-fin-4-dashboard:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    pids_limit: 256
    networks: [sealed]

  tunnel:
    image: cloudflare/cloudflared:2026.10.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in the env file}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      dashboard:
        condition: service_healthy
    networks: [sealed, internet]

networks:
  sealed:
    internal: true
  internet: {}
