# Hosted dashboard. cloudflared is the only way in. The server's firewall blocks the hosting user
# from localhost and the LAN, so the app can reach the public internet only (for the Live tab).
# Run on the server as the hosting user. TUNNEL_TOKEN and DATA_GOV_SG_API_KEY_DEV come from an
# env file outside the repo:
#   docker compose --env-file ~/secrets/sih-fin-4.env up -d --build
name: sih-fin-4

services:
  dashboard:
    build: .
    image: sih-fin-4-dashboard:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    pids_limit: 256
    environment:
      SIH_LIVE_DATA: "on"
      DATA_GOV_SG_API_KEY_DEV: ${DATA_GOV_SG_API_KEY_DEV:?missing in the env file}
    networks: [sealed, internet]

  tunnel:
    image: cloudflare/cloudflared:2026.10.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in the env file}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      dashboard:
        condition: service_healthy
    networks: [sealed, internet]

networks:
  sealed:
    internal: true
  internet: {}
